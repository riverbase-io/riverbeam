[package]
name = "beam_domain"
description = "The beam domain: riverbase typed commands that queue work, and typed queries"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
beam_env = { workspace = true }
async-trait = { workspace = true }
beam_core = { workspace = true }
beam_execution = { workspace = true }
beam_store = { workspace = true }
beam_telemetry = { workspace = true }
beam_types = { workspace = true }
chrono = { workspace = true }
garde = { workspace = true }
riverbase_core = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Tests build beams with security on (the default config).
beam_core = { workspace = true, features = ["security-rules"] }
diesel = { workspace = true }
diesel-async = { workspace = true }
beam_runtime = { workspace = true, features = ["testing"] }
beam_store = { workspace = true, features = ["testing"] }
beam_stream = { workspace = true }
beam_tools = { workspace = true }
beam_worker = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
