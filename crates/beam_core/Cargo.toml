[package]
name = "beam_core"
description = "RiverBeam orchestrator, invoke pipeline, and BEM error catalogue"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
beam_env = { workspace = true }
async-trait = { workspace = true }
beam_agents = { workspace = true }
beam_audit = { workspace = true, features = ["postgres"] }
beam_context = { workspace = true }
beam_errors = { workspace = true }
beam_evals = { workspace = true }
beam_execution = { workspace = true }
beam_gateway = { workspace = true }
beam_runtime = { workspace = true }
futures-util = { workspace = true }
riverbase_core = { workspace = true }
beam_knowledge = { workspace = true }
beam_memory = { workspace = true }
beam_usage = { workspace = true }
beam_routing = { workspace = true }
beam_security = { workspace = true, features = ["postgres"] }
beam_telemetry = { workspace = true }
beam_store = { workspace = true }
beam_stream = { workspace = true }
beam_tools = { workspace = true }
beam_types = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
beam_knowledge = { workspace = true }
beam_runtime = { workspace = true, features = ["testing"] }
beam_store = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
uuid = { workspace = true }

[lints]
workspace = true
