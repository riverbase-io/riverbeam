[package]
name = "beam_security"
description = "Security checks for riverbeam (OWASP Top 10 for LLM Applications)"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
# Decision persistence in Postgres (`PgSecurityStore`).
postgres = ["dep:beam_store"]

[dependencies]
async-trait = { workspace = true }
beam_store = { workspace = true, optional = true }
tracing = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
beam_store = { workspace = true, features = ["testing"] }
riverbase_core = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
