[package]
name = "beam_security"
description = "Security rule KB engine for riverbeam (OWASP LLM Top 10 parity)"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = ["rules"]
# The rule engine (`SecurityManager`) on `river_reed`, a library outside
# riverbase. Without it a beam must run with SECURITY_ENABLED off.
rules = ["dep:river_reed"]
# Decision persistence in Postgres (`PgSecurityStore`).
postgres = ["dep:beam_store"]

[dependencies]
async-trait = { workspace = true }
beam_store = { workspace = true, optional = true }
tracing = { workspace = true }
river_reed = { workspace = true, optional = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true }

[dev-dependencies]
beam_store = { workspace = true, features = ["testing"] }
riverbase_core = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
