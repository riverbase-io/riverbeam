[package]
name = "beam_runtime"
description = "Agent runtime contract for riverbeam, with the rig agent-loop driver (replaces LangGraph)"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
beam_errors = { workspace = true }
beam_execution = { workspace = true }
beam_store = { workspace = true }
beam_types = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
# rig is pinned exactly: a saved run is only readable by the same RUN_FORMAT (plan 005, Phase 04).
rig-agent = { version = "=0.44.0", default-features = false }
rig-core = { version = "=0.44.0", default-features = false }
riverbase_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# `ScriptedModel`, `ScriptedTools`, `ScriptedTurn`: test doubles, for tests
# only (plan 017).
testing = []

[dev-dependencies]
# This crate's integration tests use the scripted doubles and `testdb`.
beam_runtime = { path = ".", features = ["testing"] }
beam_store = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
