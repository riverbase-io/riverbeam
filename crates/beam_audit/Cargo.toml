[package]
name = "beam_audit"
description = "Structured audit events and sinks for riverbeam"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[features]
default = []
# `SqlSink` on `agent_event`.
postgres = ["dep:beam_store"]

[dependencies]
async-trait = { workspace = true }
beam_store = { workspace = true, optional = true }
beam_telemetry = { workspace = true }
beam_types = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
beam_store = { workspace = true, features = ["testing"] }
diesel = { workspace = true }
diesel-async = { workspace = true }
riverbase_core = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros"] }
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true
