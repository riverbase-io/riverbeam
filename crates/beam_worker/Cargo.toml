[package]
name = "beam_worker"
description = "Worker task dispatch for riverbeam (invoke + knowledge + memory RPC)"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }

[dependencies]
beam_env = { workspace = true }
async-trait = { workspace = true }
beam_core = { workspace = true }
beam_store = { workspace = true }
beam_stream = { workspace = true }
beam_telemetry = { workspace = true }
beam_types = { workspace = true }
riverbase_core = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Tests build beams with security on (the default config).
beam_core = { workspace = true, features = ["security-rules"] }
beam_store = { workspace = true, features = ["testing"] }
diesel = { workspace = true }
diesel-async = { workspace = true }
beam_knowledge = { workspace = true }
beam_runtime = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { workspace = true }

[features]
default = []

[lints]
workspace = true
